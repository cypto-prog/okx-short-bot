name: 執行市場掃描

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘執行一次
  workflow_dispatch:  # 允許你手動按鈕觸發

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 💡 自動安裝所有需要的套件
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas pandas-ta requests

      - name: 執行市場掃描機器人
        run: python bot.py