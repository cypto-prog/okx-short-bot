name: OKX Short Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_scan]

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: |
          pip install --upgrade pip
          pip install requests ccxt pandas

      - name: 執行市場掃描
        run: python bot.py