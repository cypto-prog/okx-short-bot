name: OKX Short Scanner / run-scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘跑一次（依你的設定為主）
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼 (Checkout repository)
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需相依套件 (Install dependencies)
        run: |
          pip install --upgrade pip
          pip install ccxt pandas pandas-ta requests

      - name: 執行市場掃描機器人
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py