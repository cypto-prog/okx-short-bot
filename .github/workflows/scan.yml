name: OKX Short Scanner / run-scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # 內建每 5 分鐘定時鬧鐘
  workflow_dispatch:        # 允許手動點擊觸發
  repository_dispatch:
    types: [run-scanner]    # 允許外部 cron-job.org 透過 POST 請求觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install ccxt pandas requests

      - name: 執行掃描機器人
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py