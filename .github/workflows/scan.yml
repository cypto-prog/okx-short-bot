name: OKX Short Scanner

on:
  schedule:
    # 讓 GitHub 雲端伺服器每 15 分鐘自動執行一次
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: pip install ccxt pandas ta requests

      - name: 執行市場掃描
        run: python bot.py
